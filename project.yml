name: AppMixer
options:
  bundleIdPrefix: com.dgim9390
  deploymentTarget:
    macOS: "14.2"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-" # 로컬 임시 서명. 팀 서명은 4단계에서
targets:
  AppMixer:
    type: application
    platform: macOS
    sources: [AppMixer]
    info:
      path: AppMixer/Info.plist
      properties:
        CFBundleDisplayName: AppMixer
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "3"
        LSUIElement: true
        NSAudioCaptureUsageDescription: 앱별 볼륨을 조절하려면 각 앱의 오디오를 가져와야 합니다.
    entitlements:
      path: AppMixer/AppMixer.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dgim9390.AppMixer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # scripts/make-icon.swift로 생성
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets: [AppMixerTests]
  AppMixerTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppMixerTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AppMixer
